name: Windows build

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "assets/**", "installer/**", ".github/workflows/windows.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build the installer and the zip"
        type: boolean
        default: false
  # release.yml builds the release packages with this
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  # libmpv from shinchiro's mpv builds, pinned to one release and checked against
  # its SHA-256, so a release always ships the same, known libmpv
  MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
  MPV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # libmpv is loaded at runtime, so building and testing don't need it
      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Get libmpv
        if: inputs.package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:MPV_URL -OutFile mpv.7z
          $hash = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv archive checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force third_party/mpv | Out-Null
          7z e -y mpv.7z libmpv-2.dll -othird_party/mpv | Out-Null
          Get-Item third_party/mpv/libmpv-2.dll

      - name: Package
        id: pkg
        if: inputs.package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null

          # installer
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=$version" installer\streamtube.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          # zip: the app and libmpv, to run without installing
          $name = "RustTube-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/rusttube.exe, third_party/mpv/libmpv-2.dll, README.md "dist/$name/"
          Copy-Item LICENSE "dist/$name/LICENSE.txt"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error
